<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepL 翻译助手</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <h2>🌐 DeepL 翻译助手</h2>

    <div class="section">
        <label for="translationProvider">翻译引擎:</label>
        <select id="translationProvider">
            <option value="deepl">DeepL API</option>
            <option value="local">本地模型（Ollama / LM Studio）</option>
            <option value="openrouter">OpenRouter（在线模型）</option>
        </select>
        <div class="help-text">划词、全文和 X 帖子翻译都使用这里选择的引擎，不会自动切换</div>
    </div>

    <div class="api-key-section" id="deeplSettings">
        <div class="section">
            <label for="apiKey">DeepL API Key:</label>
            <input type="password" id="apiKey" placeholder="输入你的 DeepL API Key">
            <div class="help-text">
                获取 API Key: <a href="https://www.deepl.com/pro-api" target="_blank">DeepL API</a>
            </div>
        </div>
        <button class="save-btn" id="saveApiKey">保存 API Key</button>
    </div>

    <div class="api-key-section" id="localSettings" hidden>
        <div class="section">
            <label for="localEndpoint">服务地址:</label>
            <input type="url" id="localEndpoint" placeholder="http://127.0.0.1:11434/v1">
            <div class="help-text">Ollama 默认 http://127.0.0.1:11434/v1，LM Studio 为 http://127.0.0.1:1234/v1</div>
        </div>
        <div class="section">
            <label for="localModel">模型名称:</label>
            <input type="text" id="localModel" placeholder="hf.co/mradermacher/Hunyuan-MT-7B-GGUF:Q5_K_M">
        </div>
        <div class="button-row">
            <button class="save-btn" id="saveLocal">保存设置</button>
            <button class="test-btn" id="testLocal">测试连接</button>
        </div>
    </div>

    <div class="api-key-section" id="openrouterSettings" hidden>
        <div class="section">
            <label for="openrouterApiKey">OpenRouter API Key:</label>
            <input type="password" id="openrouterApiKey" placeholder="sk-or-...">
            <div class="help-text">获取 API Key: <a href="https://openrouter.ai/keys" target="_blank">OpenRouter</a></div>
        </div>
        <div class="section">
            <label for="openrouterModelSelect">模型:</label>
            <select id="openrouterModelSelect">
                <option value="xiaomi/mimo-v2.6-pro">小米 MiMo-V2.6-Pro · 通用旗舰 · $0.44 / $0.87</option>
                <option value="tencent/hy-mt2-30b-a3b">腾讯 Hy-MT2-30B · 翻译专用 · $0.07 / $0.30</option>
                <option value="qwen/qwen3.8-flash">Qwen3.8-Flash · 通用，中文强 · $0.15 / $0.47</option>
                <option value="anthropic/claude-haiku-5.5">Claude Haiku 5.5 · 通用，听指令 · $0.10 / $0.50</option>
                <option value="openai/gpt-6-luna">GPT-6 Luna · 通用 · $0.10 / $0.50</option>
                <option value="deepseek/deepseek-v4.1-flash">DeepSeek V4.1 Flash · 通用 · $0.04 / $0.68</option>
                <option value="qwen/qwen3.8-max-0902">Qwen3.8-Max · 通用旗舰 · $2 / $6</option>
                <option value="custom">其他模型（手动填写）</option>
            </select>
            <input type="text" id="openrouterModel" placeholder="填写 OpenRouter 模型名，如 vendor/model" hidden>
            <div class="help-text">选择后立即生效；价格为每百万 token 输入 / 输出，2026 年 10 月数据</div>
        </div>
        <div class="button-row">
            <button class="save-btn" id="saveOpenrouter">保存设置</button>
            <button class="test-btn" id="testOpenrouter">测试连接</button>
        </div>
    </div>

    <div class="section">
        <label for="sourceText">要翻译的文本:</label>
        <textarea id="sourceText" placeholder="输入或粘贴要翻译的段落..."></textarea>
    </div>

    <div class="section">
        <label for="sourceLang">源语言:</label>
        <select id="sourceLang">
            <option value="AUTO">自动检测</option>
            <option value="EN">英语</option>
            <option value="ZH">中文</option>
            <option value="JA">日语</option>
            <option value="KO">韩语</option>
            <option value="FR">法语</option>
            <option value="DE">德语</option>
            <option value="ES">西班牙语</option>
            <option value="IT">意大利语</option>
            <option value="RU">俄语</option>
        </select>
    </div>

    <div class="section">
        <label for="targetLang">目标语言:</label>
        <select id="targetLang">
            <option value="ZH">中文</option>
            <option value="EN-US">英语(美)</option>
            <option value="EN-GB">英语(英)</option>
            <option value="JA">日语</option>
            <option value="KO">韩语</option>
            <option value="FR">法语</option>
            <option value="DE">德语</option>
            <option value="ES">西班牙语</option>
            <option value="IT">意大利语</option>
            <option value="RU">俄语</option>
        </select>
    </div>

    <button id="translateBtn">翻译</button>

    <div id="result" class="result" role="status" aria-live="polite"></div>
    <div id="resultMeta" class="help-text"></div>

    <button class="capture-btn" id="capturePageBtn">📸 保存整页截图</button>

    <script src="src/shared/core.js"></script>
    <script src="src/shared/client.js"></script>
    <script src="popup.js"></script>
</body>

</html>
